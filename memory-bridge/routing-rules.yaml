# memory-bridge/routing-rules.yaml
version: 1
rules:
  - match:
      type: feedback
      min_length: 50
    destinations:
      memory: immediate
      mempalace: batch
      priority: medium

  - match:
      type: architecture_decision
      min_length: 50
    destinations:
      memory: immediate
      mempalace: priority_push
      priority: high

  - match:
      type: user_preference
    destinations:
      memory: immediate
      mempalace: skip

  - match:
      type: session_observation
    destinations:
      memory: skip
      mempalace: batch
      priority: low

  - match:
      type: pattern
      min_confidence: 0.8
    destinations:
      memory: pattern_signal
      mempalace: after_user_confirm
      priority: medium
